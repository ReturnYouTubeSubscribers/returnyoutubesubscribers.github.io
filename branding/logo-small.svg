<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Return YouTube Subscribers</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5A4E"/>
      <stop offset="1" stop-color="#C8102E"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ring"><circle cx="256" cy="260" r="104"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <g fill="#fff">
    <!-- return arrow -->
    <path d="M393.0 199.0A150 150 0 1 1 237.7 111.1" fill="none" stroke="#fff" stroke-width="56" stroke-linecap="round"/>
    <path d="M287.3 105.0L228.1 65.9L239.4 157.3Z" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
    <!-- subscriber -->
    <circle cx="256" cy="220" r="60"/>
    <path clip-path="url(#ring)" d="M150 420c0-80 47-130 106-130s106 50 106 130z"/>
  </g>
</svg>
